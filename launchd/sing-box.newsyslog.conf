# Ротация логов sing-box. Устанавливается в /etc/newsyslog.d/sing-box.conf
#
# Формат: logfilename [owner:group] mode count size when flags
#   mode  640   — читать может только root и группа wheel
#   count 5     — хранить 5 архивов
#   size  5000  — ротировать при 5 МБ (в килобайтах)
#   when  *     — по расписанию не ротировать, только по размеру
#   flags GZ    — G: имя файла как glob, Z: сжимать gzip
#
# ВАЖНО про переоткрытие файла.
# Логи пишет не sing-box, а launchd — через StandardOutPath. launchd держит
# файловый дескриптор открытым и после ротации продолжит писать в
# переименованный (уже архивный) файл: новый sing-box.log останется пустым.
# Поэтому здесь флаг N — не слать процессу сигнал, он всё равно не поможет.
#
# Чтобы вернуть запись в новый файл после ротации, нужен перезапуск демона:
#     sudo launchctl kickstart -k system/com.singbox.daemon
# Это кратковременный разрыв сети (TUN пересоздаётся), поэтому делать
# осознанно, а не по расписанию.
#
# На практике при "level": "warn" лог растёт медленно, и ротация
# случается редко. Если хочется полностью избежать проблемы — задайте
# в config.json log.output: "/var/log/sing-box/sing-box.log"; тогда файл
# открывает сам sing-box, но переоткрытие всё равно потребует SIGHUP,
# который в sing-box перезагружает конфиг целиком (тот же разрыв).

/var/log/sing-box/*.log    root:wheel    640    5    5000    *    GNZ
